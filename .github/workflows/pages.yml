name: Déployer sur GitHub Pages

# Miroir statique (sans API live : l'application utilise alors
# l'instantané de marché data/market-snapshot.json).
on:
  push:
    branches: ["claude/financial-portfolio-app-eePhX"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer le site (sans tests, docs ni scripts)
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg src data _site/

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload du site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
